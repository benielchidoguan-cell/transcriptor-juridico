name: Actualizar sitio (main -> gh-pages)
# GitHub Pages publica la rama gh-pages. Cada cambio en main se copia allí automáticamente.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copiar main a gh-pages
        run: git push origin HEAD:refs/heads/gh-pages --force
